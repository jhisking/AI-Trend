name: daily-report

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 한국시간 08:00 (GitHub 사정으로 몇 분~1시간 늦을 수 있음)
  workflow_dispatch:        # 메일의 "지금 새로 수집" 버튼 / Actions 탭의 Run workflow
  push:                     # 임시 시험용: .run-test 파일이 바뀌면 실행 (시험 후 제거)
    paths: [".run-test"]

permissions:
  contents: write           # 기록 파일(history.json 등) 커밋
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 비밀값 점검 (값은 출력하지 않음)
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend.py check
      - name: 수집, 보고서 생성, 메일 발송
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 호출 한도가 시간당 60회에서 5,000회로 늘어남
          SKIP_SEND: ${{ github.event_name == 'push' }}   # push(시험 트리거)로 돈 경우 발송 생략
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend.py ci
      - name: 기록 파일 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json translations.json details.json watchers.json || true
          git diff --cached --quiet || (git commit -m "chore: 수집 기록 갱신" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
